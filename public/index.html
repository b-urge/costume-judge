<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Costume Judge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <!-- Comic Neue for better Comic Sans on mobile -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="book">
    <header class="cover">
      <div class="corner-gif" aria-hidden="true">
        <img src="/gifs/flying-bat.gif" alt="">
      </div>
      <div class="header-banner-container">
        <img src="/gifs/skull_trumpet_animated.gif" alt="" class="skull-trumpet skull-left" aria-hidden="true">
        <h1 class="title-logo">
          <img src="/images/attached-header.png" alt="Costume Judge" class="logo-img header-attached" id="header-attached">
        </h1>
        <img src="/gifs/skull_trumpet_animated.gif" alt="" class="skull-trumpet skull-right" aria-hidden="true">
      </div>
    </header>

    <section class="illustration" aria-labelledby="camera-heading">
      <div class="frame">
        <h2 id="camera-heading">Present your costume</h2>
        <div id="camera">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" hidden></canvas>
        </div>
        <div class="button-group">
          <button id="judge" type="button">JUDGE</button>
          <label for="file-input" class="file-label">or upload photo
            <input type="file" id="file-input" accept="image/*" style="display:none;">
          </label>
        </div>
      </div>
      <div class="skull" aria-hidden="true">
        <img src="/gifs/spinning-skull.gif" alt="">
      </div>
    </section>

    <section id="result" aria-live="polite"></section>
  </main>

  <script src="/main.js"></script>
</body>
</html>
